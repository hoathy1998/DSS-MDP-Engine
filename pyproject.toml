[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dipmdp"
version = "0.1.0"
description = "Reproduction of Voorberg et al. (2021): CMMN-to-MDP decision support for decision-intensive processes"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
