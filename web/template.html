<title>Bộ khuyến nghị Koffer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a maintenance work card. Case file tags on the left, the next-step ledger on the right. */
:root {
  --bg: #eef2f1; --panel: #fbfdfc; --ink: #15211f; --muted: #55645f; --line: #d0d9d6;
  --accent: #0d6657; --accent-ink: #ffffff; --accent-soft: #d9eee8; --alert: #a34a12; --alert-soft: #f8e6d8;
  --sans: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1615; --panel: #172120; --ink: #e5eeeb; --muted: #9aaaa5; --line: #2d3a37;
    --accent: #62cfb7; --accent-ink: #08201b; --accent-soft: #143530; --alert: #eda06b; --alert-soft: #3a2415;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1615; --panel: #172120; --ink: #e5eeeb; --muted: #9aaaa5; --line: #2d3a37;
  --accent: #62cfb7; --accent-ink: #08201b; --accent-soft: #143530; --alert: #eda06b; --alert-soft: #3a2415;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
#app { max-width: 1160px; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
h1 { font-size: 1.5rem; line-height: 1.25; font-weight: 700; margin: 0; text-wrap: balance; }
h2 { font-size: 1.05rem; font-weight: 600; margin: 0; }
h3 { font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
p { margin: 0; }
ul, ol { list-style: none; margin: 0; padding: 0; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.brand { display: grid; gap: 2px; min-width: 0; flex: 1 1 320px; }
.brand p { color: var(--muted); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 12px; color: var(--muted); font-weight: 500; margin-bottom: -1px; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: flex-end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .label, .s-label { font-size: .78rem; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
select, .ghost { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; }
select { max-width: 100%; }
.segments { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--panel); width: fit-content; max-width: 100%; }
.seg { background: none; border: 0; padding: 6px 12px; }
.seg + .seg { border-left: 1px solid var(--line); }
.seg[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 500; }
.grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.narrow { max-width: 760px; width: 100%; }
.tags { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tag { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 4px; }
.tag .code { font: 600 .8rem var(--mono); color: var(--muted); grid-row: span 2; }
.tag .name { font-size: .8rem; line-height: 1.3; color: var(--muted); }
.tag .val { font: 500 1.15rem var(--mono); font-variant-numeric: tabular-nums; }
.tag .note { grid-column: 2; font-size: .72rem; color: var(--muted); }
.tag.known { border: 1px solid var(--accent); background: var(--accent-soft); }
.tag.known .code { color: var(--accent); }
.tag.revealed .val { color: var(--muted); }
.plan { display: grid; gap: 4px; }
.plan li { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: baseline; font-size: .88rem; color: var(--muted); }
.plan li.done { color: var(--ink); }
.tick { color: var(--accent); font-weight: 700; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; border-block: 1px solid var(--line); padding-block: 10px; }
.stats > div, .big { display: grid; gap: 2px; align-content: start; }
.s-value { font: 500 1.1rem var(--mono); font-variant-numeric: tabular-nums; }
.big .s-value { font-size: 1.6rem; }
.actions { display: grid; gap: 6px; }
.action { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; background: none; border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
.action:hover { border-color: var(--accent); }
.action.best { border-color: var(--accent); background: var(--accent-soft); }
.a-code { font: 600 .85rem var(--mono); color: var(--muted); }
.a-main { display: grid; min-width: 0; }
.a-name { font-weight: 500; line-height: 1.35; }
.a-detail, .a-gap { font-size: .76rem; color: var(--muted); }
.a-value { display: grid; justify-items: end; }
.a-q { font: 500 1rem var(--mono); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; margin-left: 8px; padding: 0 7px; border-radius: 3px; background: var(--accent); color: var(--accent-ink); font-size: .7rem; font-weight: 600; vertical-align: 1px; }
.locked { font-size: .88rem; color: var(--alert); background: var(--alert-soft); border-radius: 4px; padding: 8px 10px; }
.hint { font-size: .8rem; color: var(--muted); max-width: 68ch; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); text-align: left; font-weight: 400; }
thead th { font-size: .76rem; color: var(--muted); }
th.num { text-align: right; font-family: var(--sans); }
td.num { white-space: nowrap; }
.strong { font-weight: 600; }
.best-row th, .best-row td { background: var(--accent-soft); }
.primary { justify-self: start; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 4px; padding: 8px 14px; font-weight: 500; }
.log ol { display: grid; gap: 4px; counter-reset: step; }
.log li { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: .86rem; counter-increment: step; }
.log li::before { content: counter(step); font: 500 .8rem var(--mono); color: var(--muted); min-width: 18px; }
.followed { color: var(--muted); }
.deviated { color: var(--alert); }
.formula { font: 500 1rem var(--mono); background: var(--accent-soft); border-radius: 4px; padding: 10px 12px; overflow-x: auto; }
.note-box { background: var(--alert-soft); border-radius: 4px; padding: 10px 12px; font-size: .88rem; }
.toolbar.plain { gap: 12px 24px; }
@media (max-width: 820px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: no-preference) { .action, .tab, .seg { transition: border-color .12s, background-color .12s; } }
</style>
<div id="app"></div>
<script>
/*__DATA__*/
/*__SOLVER__*/
/*__APP__*/
const app = createApp(DEMO_DATA, Y_FUNCTIONS, buildSolver);
const root = document.getElementById("app");
const allowedViews = new Set(["koffer", "toy", "about"]);

function render() {
  root.innerHTML = app.html();
}

function send(text, focusKey) {
  const split = text.indexOf(":");
  app.dispatch([text.slice(0, split), text.slice(split + 1)]);
  render();
  const again = focusKey && root.querySelector(`[data-msg="${CSS.escape(focusKey)}"]`);
  if (again) again.focus();
  else if (focusKey) root.querySelector("h2")?.setAttribute("tabindex", "-1"), root.querySelector("h2")?.focus();
}

root.addEventListener("click", (event) => {
  const target = event.target.closest("[data-msg]");
  if (!target) return;
  const message = target.dataset.msg;
  if (message.startsWith("view:")) {
    try { location.hash = message.slice(5); } catch (error) { /* the hash is only a convenience */ }
  }
  send(message, message);
});

root.addEventListener("change", (event) => {
  if (event.target.dataset.change) send(`${event.target.dataset.change}:${event.target.value}`);
});

function fromHash() {
  const view = location.hash.slice(1);
  if (allowedViews.has(view)) app.dispatch(["view", view]);
  render();
}
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
