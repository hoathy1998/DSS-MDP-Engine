<style>
/* Layout: a maintenance work card. Case file tags on the left, the next-step ledger on the right. */
:root {
  --bg: #eef2f1; --panel: #fbfdfc; --ink: #15211f; --muted: #55645f; --line: #d0d9d6;
  --accent: #0d6657; --accent-ink: #ffffff; --accent-soft: #d9eee8; --alert: #a34a12; --alert-soft: #f8e6d8;
  --sans: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1615; --panel: #172120; --ink: #e5eeeb; --muted: #9aaaa5; --line: #2d3a37;
    --accent: #62cfb7; --accent-ink: #08201b; --accent-soft: #143530; --alert: #eda06b; --alert-soft: #3a2415;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1615; --panel: #172120; --ink: #e5eeeb; --muted: #9aaaa5; --line: #2d3a37;
  --accent: #62cfb7; --accent-ink: #08201b; --accent-soft: #143530; --alert: #eda06b; --alert-soft: #3a2415;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
#app { max-width: 1160px; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
h1 { font-size: 1.5rem; line-height: 1.25; font-weight: 700; margin: 0; text-wrap: balance; }
h2 { font-size: 1.05rem; font-weight: 600; margin: 0; }
h3 { font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
p { margin: 0; }
ul, ol { list-style: none; margin: 0; padding: 0; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.brand { display: grid; gap: 2px; min-width: 0; flex: 1 1 320px; }
.brand p { color: var(--muted); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 12px; color: var(--muted); font-weight: 500; margin-bottom: -1px; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: flex-end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .label, .s-label { font-size: .78rem; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
select, .ghost { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; }
select { max-width: 100%; }

.seg { background: none; border: 0; padding: 6px 12px; }

.grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.narrow { max-width: 760px; width: 100%; }
.tags { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tag { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 4px; }
.tag .code { font: 600 .8rem var(--mono); color: var(--muted); grid-row: span 2; }
.tag .name { font-size: .8rem; line-height: 1.3; color: var(--muted); }

.tag.known .code { color: var(--accent); }
.tag.revealed .val { color: var(--muted); }
.plan { display: grid; gap: 4px; }

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }

.s-value { font: 500 1.1rem var(--mono); font-variant-numeric: tabular-nums; }
.big .s-value { font-size: 1.6rem; }
.actions { display: grid; gap: 6px; }

.a-main { display: grid; min-width: 0; }
.a-name { font-weight: 500; line-height: 1.35; }
.a-detail, .a-gap { font-size: .76rem; color: var(--muted); }
.a-value { display: grid; justify-items: end; }
.a-q { font: 500 1rem var(--mono); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; margin-left: 8px; padding: 0 7px; border-radius: 3px; background: var(--accent); color: var(--accent-ink); font-size: .7rem; font-weight: 600; vertical-align: 1px; }
.locked { font-size: .88rem; color: var(--alert); background: var(--alert-soft); border-radius: 4px; padding: 8px 10px; }
.hint { font-size: .8rem; color: var(--muted); max-width: 68ch; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); text-align: left; font-weight: 400; }
thead th { font-size: .76rem; color: var(--muted); }
th.num { text-align: right; font-family: var(--sans); }
td.num { white-space: nowrap; }
.strong { font-weight: 600; }
.best-row th, .best-row td { background: var(--accent-soft); }
.primary { justify-self: start; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 4px; padding: 8px 14px; font-weight: 500; }
.log ol { display: grid; gap: 4px; counter-reset: step; }
.log li { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: .86rem; counter-increment: step; }
.log li::before { content: counter(step); font: 500 .8rem var(--mono); color: var(--muted); min-width: 18px; }
.followed { color: var(--muted); }
.deviated { color: var(--alert); }
.formula { font: 500 1rem var(--mono); background: var(--accent-soft); border-radius: 4px; padding: 10px 12px; overflow-x: auto; }
.note-box { background: var(--alert-soft); border-radius: 4px; padding: 10px 12px; font-size: .88rem; }
.toolbar.plain { gap: 12px 24px; }
@media (max-width: 820px) {
  .grid { grid-template-columns: minmax(0, 1fr); }

}
@media (prefers-reduced-motion: no-preference) { .action, .tab, .seg { transition: border-color .12s, background-color .12s; } }

    const result = [];
    for (const task of tasks) {
      if (isDone(state, task.id) || !task.preceding.every((id) => isDone(state, id))) continue;
      let q = -task.cost;
      task.probs.forEach((p, outcome) => {
        q += p * value(withDigit(state, task.id, outcome + 1));
      });
      result.push({ kind: "do", id: task.id, q });
    }
    if (canDecide(state)) {
      for (const decision of spec.decisions) {
        result.push({ kind: "decide", decision, q: decisionValue(state, decision) });
      }
    }
    return result;
  }

  // Assumption A9: decisions first in YAML order, then lower cost, then YAML order.
  function tieRank(action) {
    if (action.kind === "decide") return [0, 0, spec.decisions.indexOf(action.decision)];
    return [1, tasks[position.get(action.id)].cost, position.get(action.id)];
  }

  function recommended(state) {
    const actions = actionValues(state);
    const best = Math.max(...actions.map((action) => action.q));
    const tied = actions.filter((action) => best - action.q <= TIE_TOLERANCE);
    tied.sort((a, b) => {
      const [ra, rb] = [tieRank(a), tieRank(b)];
      return ra[0] - rb[0] || ra[1] - rb[1] || ra[2] - rb[2];
    });
    return tied[0];
  }

  function perform(state, action, trueValues) {
    const task = tasks[position.get(action.id)];
    const digit = task.isAttribute ? task.values.indexOf(trueValues[task.id]) + 1 : 1;
    return withDigit(state, task.id, digit);
  }

  function realisedY(trueValues, decision) {
    if (typeof decision === "string") return 0;
    const scope = { ...trueValues, f: decision };
    if (accept) {
      const attr = attributes.find((a) => a.id === "D");
      scope.P = acceptProbability(decision, attr.values.indexOf(trueValues.D) + 1);
    }
    return yFunction(scope);
  }

  function simulate(act, trueValues) {
    let state = rootState();
    let cost = 0;
    const steps = [];
    for (;;) {
      const action = act(state);
      if (action.kind === "decide") {
        const revenue = realisedY(trueValues, action.decision);
        return { decision: action.decision, cost, revenue, profit: revenue - cost, state, steps };
      }
      cost += tasks[position.get(action.id)].cost;
      steps.push(action.id);
      state = perform(state, action, trueValues);
    }
  }

  function treePolicy(tree) {
    return (state) => {
      let node = tree.nodes[tree.root];
      for (;;) {
        if (node.type === "decide") return { kind: "decide", decision: node.decision };
        if (node.type === "check") {
          const digit = state[position.get(node.attribute)];
          if (!digit) return { kind: "do", id: node.attribute };
          const attr = tasks[position.get(node.attribute)];
          node = tree.nodes[node.branches[String(attr.values[digit - 1])]];
        } else {
          const pending = node.items.find((id) => !isDone(state, id));
          if (pending !== undefined) return { kind: "do", id: pending };
          node = tree.nodes[node.next];
        }
      }
    };
  }

  function observe(state, id, valueOfAttribute) {
    return withDigit(state, id, tasks[position.get(id)].values.indexOf(valueOfAttribute) + 1);
  }

  return {
    tasks, attributes, plan, rootState, isDone, value, canDecide, missingRequired, actionValues,
    recommended, perform, realisedY, simulate, treePolicy, observe,
    digitOf: (state, id) => state[position.get(id)],
  };
}

};
const VARIANT_LABELS = {
  margin_all: "Công thức in trong bài",
  margin_repair: "Đối chứng: F, I tính một lần",
};

  ["koffer", "Hồ sơ Koffer"],
  ["toy", "Ví dụ nhỏ"],
  ["about", "Về mô hình"],
];
const SAMPLE_SEED = 42;

function number(value, digits = 1) {
  const text = value.toLocaleString("vi-VN", { minimumFractionDigits: digits, maximumFractionDigits: digits });
  return text.replace("-", "−");
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}

function seededRandom(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function drawCase(attributes, random) {
  const values = {};
  for (const attr of attributes) {
    let u = random();
    let index = attr.probs.findIndex((p) => (u -= p) < 0);
    if (index < 0) index = attr.values.length - 1;
    values[attr.id] = attr.values[index];
  }
  return values;
}

function createApp(data, Y_FUNCTIONS, buildSolver, random = Math.random) {
  const solvers = new Map();

  function solverFor(model, variant) {
    const key = `${model}/${variant}`;
    if (!solvers.has(key)) {
      solvers.set(key, buildSolver(data[model], variant, Y_FUNCTIONS[model][variant]));
    }
    return solvers.get(key);
  }

  const state = {
    view: "koffer",
    variant: data.koffer.default_variant,
    caseId: "sample",
    toy: {},
    run: null,
  };

  function solver() {
    return solverFor("koffer", state.variant);
  }

  function startCase(trueValues, caseId) {
    state.caseId = caseId;
    state.run = { truth: trueValues, state: solver().rootState(), cost: 0, log: [], decision: null };
  }

  function caseValues(caseId) {
    if (caseId === "sample") return drawCase(data.koffer.attributes, seededRandom(SAMPLE_SEED));
    const row = data.table6.find((item) => String(item.instance) === caseId);
    return Object.fromEntries(data.koffer.attributes.map((attr, i) => [attr.id, row.final_state[i]]));
  }

  startCase(caseValues("sample"), "sample");

  function dispatch(message) {
    const [kind, argument] = message;
    if (kind === "view") state.view = argument;
    if (kind === "variant") {
      state.variant = argument;
      startCase(state.run.truth, state.caseId);
    }
    if (kind === "case") startCase(caseValues(argument), argument);
    if (kind === "random") startCase(drawCase(data.koffer.attributes, random), "random");
    if (kind === "restart") startCase(state.run.truth, state.caseId);
    if (kind === "toy") {
      const [id, value] = argument.split("=");
      if (value === "") delete state.toy[id];
      else state.toy[id] = Number(value);
    }
    if (kind === "do") act({ kind: "do", id: argument });
    if (kind === "decide") {
      act({ kind: "decide", decision: data.koffer.decisions.find((d) => String(d) === argument) });
    }
  }

  function act(action) {
    const run = state.run;
    const s = solver();
    const best = s.recommended(run.state);
    const same = best.kind === action.kind && best.id === action.id && best.decision === action.decision;
    run.log.push({ action: actionName(action), followed: same, recommended: actionName(best) });
    if (action.kind === "decide") {
      run.decision = action.decision;
      return;
    }
    run.cost += s.tasks.find((task) => task.id === action.id).cost;
    run.state = s.perform(run.state, action, run.truth);
  }

  function taskCode(task) {
    return LABELS.plan[task.id] || (task.task_id ? `${task.task_id}` : task.id);
  }

  function decisionName(decision) {
    return typeof decision === "string" ? "Không báo giá" : `Báo giá ${decision}`;
  }

  function actionName(action) {
    if (action.kind === "decide") return decisionName(action.decision);
    return LABELS.tasks[action.id];
  }

  function header() {
    const tabs = VIEWS.map(
      ([id, label]) =>
        `<button class="tab" data-msg="view:${id}" aria-current="${state.view === id ? "page" : "false"}">${label}</button>`,
    ).join("");
    return `<header class="top">
      <div class="brand"><h1>Koffer: nên thu thập thêm hay báo giá ngay?</h1>
      <p>Bộ khuyến nghị MDP cho báo giá bảo trì linh kiện máy bay, tái hiện Voorberg et al. (2021).</p></div>
      <nav class="tabs" aria-label="Màn hình">${tabs}</nav></header>`;
  }

  function toolbar() {
    const options = [
      `<option value="sample"${state.caseId === "sample" ? " selected" : ""}>Hồ sơ mẫu</option>`,
      ...data.table6.map(
        (row) =>
          `<option value="${row.instance}"${state.caseId === String(row.instance) ? " selected" : ""}>Trường hợp ${row.instance}, Bảng 6</option>`,
      ),
    ];
    if (state.caseId === "random") options.unshift('<option value="random" selected>Hồ sơ ngẫu nhiên</option>');
    const variants = Object.keys(data.koffer.variants)
      .map(
        (id) =>
          `<button class="seg" data-msg="variant:${id}" aria-pressed="${state.variant === id}">${VARIANT_LABELS[id]}</button>`,
      )
      .join("");
    return `<div class="toolbar">
      <div class="field"><label for="case-select">Hồ sơ</label>
        <div class="row"><select id="case-select" data-change="case">${options.join("")}</select>
        <button class="ghost" data-msg="random:">Bốc ngẫu nhiên</button></div></div>
      <div class="field"><span class="label" id="y-label">Hàm lợi nhuận Y</span>
        <div class="segments" role="group" aria-labelledby="y-label">${variants}</div></div>
    </div>`;
  }

  function caseFile() {
    const s = solver();
    const run = state.run;
    const finished = run.decision !== null;
    const tags = s.attributes
      .map((attr) => {
        const digit = s.digitOf(run.state, attr.id);
        const known = digit !== 0;
        const shown = known ? attr.values[digit - 1] : finished ? run.truth[attr.id] : "?";
        const note = known ? `đã biết` : finished ? "chưa từng mua, giá trị thật" : `mua với giá ${number(attr.cost, 0)}`;
        return `<li class="tag${known ? " known" : ""}${!known && finished ? " revealed" : ""}">
          <span class="code">${attr.id}</span>
          <span class="name">${LABELS.attributes[attr.id]}</span>
          <span class="val">${shown}</span>
          <span class="note">${note}</span></li>`;
      })
      .join("");
    const plan = s.plan
      .map((item) => {
        const done = s.isDone(run.state, item.id);
        return `<li class="${done ? "done" : ""}"><span class="tick" aria-hidden="true">${done ? "✓" : ""}</span>
          <span>${LABELS.tasks[item.id]}</span><span class="sr">${done ? "đã xong" : "chưa làm"}</span>
          <span class="num">${number(item.cost, 0)}</span></li>`;
      })
      .join("");
    return `<section class="panel" aria-labelledby="file-h"><h2 id="file-h">Thông tin hồ sơ</h2>
      <ul class="tags">${tags}</ul>
      <h3>Thủ tục và giai đoạn</h3><ul class="plan">${plan}</ul></section>`;
  }

  function actionRow(action, best, top) {
    const s = solver();
    const isBest = action.kind === best.kind && action.id === best.id && action.decision === best.decision;
    const gap = action.q - top;
    const message = action.kind === "do" ? `do:${action.id}` : `decide:${action.decision}`;
    const task = action.kind === "do" ? s.tasks.find((item) => item.id === action.id) : null;
    const code = task ? taskCode(task) : "";
    const detail = task ? `Chi phí ${number(task.cost, 0)}` : "Kết thúc hồ sơ";
    const gapText = Math.abs(gap) < 0.05 ? "ngang mức tốt nhất" : `kém ${number(-gap)}`;
    return `<li><button class="action${isBest ? " best" : ""}" data-msg="${escapeHtml(message)}">
      <span class="a-code">${code}</span>
      <span class="a-main"><span class="a-name">${actionName(action)}${isBest ? '<span class="pill">Khuyến nghị</span>' : ""}</span>
      <span class="a-detail">${detail}</span></span>
      <span class="a-value"><span class="a-q">${number(action.q)}</span><span class="a-gap">${gapText}</span></span>
      </button></li>`;
  }

  function actionsPanel() {
    const s = solver();
    const run = state.run;
    const actions = s.actionValues(run.state).sort((a, b) => b.q - a.q);
    const best = s.recommended(run.state);
    const top = Math.max(...actions.map((action) => action.q));
    const decisions = actions.filter((action) => action.kind === "decide");
    const gathering = actions.filter((action) => action.kind === "do");
    const missing = s.missingRequired(run.state).map((task) => LABELS.tasks[task.id]);
    const decideBlock = decisions.length
      ? `<ul class="actions">${decisions.map((action) => actionRow(action, best, top)).join("")}</ul>`
      : `<p class="locked">Chưa được báo giá. Còn thiếu: ${missing.join("; ")}.</p>`;
    return `<section class="panel" aria-labelledby="act-h"><h2 id="act-h">Bước tiếp theo</h2>
      <div class="stats">
        <div><span class="s-label">Đã chi</span><span class="s-value">${number(run.cost)}</span></div>
        <div><span class="s-label">Lợi nhuận kỳ vọng còn lại</span><span class="s-value">${number(s.value(run.state))}</span></div>
        <div><span class="s-label">Kỳ vọng cả hồ sơ</span><span class="s-value">${number(s.value(run.state) - run.cost)}</span></div>
      </div>
      <h3>Báo giá cuối cùng</h3>${decideBlock}
      ${gathering.length ? `<h3>Làm thêm</h3><ul class="actions">${gathering.map((action) => actionRow(action, best, top)).join("")}</ul>` : ""}
      <p class="hint">Số lớn ở mỗi dòng là lợi nhuận kỳ vọng nếu chọn hành động đó rồi đi tiếp tối ưu, chưa trừ phần đã chi. Bạn có thể chọn khác khuyến nghị; hệ thống vẫn tính tiếp từ trạng thái mới.</p>

      <h3>So với Bảng 5 của bài báo</h3>
      <div class="scroll"><table><thead><tr><th scope="col">Chỉ số</th><th scope="col" class="num">Bài báo</th><th scope="col" class="num">Công thức in</th><th scope="col" class="num">Đối chứng</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p>Cây quyết định khớp chính xác phần không phụ thuộc Y (chi phí, số trạng thái kết thúc). Lợi nhuận thì không khớp với công thức nào đã thử, nên đây là tái hiện về phương pháp và xu hướng, chưa phải về con số.</p>
      <p class="hint">Voorberg, Eshuis, van Jaarsveld, van Houtum (2021), Decision Support Systems 151, 113632. Đồ án CS2208, UIT.</p></section>`;
  }

  function html() {
    const body = state.view === "koffer" ? kofferView() : state.view === "toy" ? toyView() : aboutView();
    return `${header()}<main>${body}</main>`;
  }

  return { dispatch, html, state, solver };
}


const app = createApp(DEMO_DATA, Y_FUNCTIONS, buildSolver);
const root = document.getElementById("app");
const allowedViews = new Set(["koffer", "toy", "about"]);

function render() {
  root.innerHTML = app.html();
}

function send(text, focusKey) {
  const split = text.indexOf(":");
  app.dispatch([text.slice(0, split), text.slice(split + 1)]);
  render();
  const again = focusKey && root.querySelector(`[data-msg="${CSS.escape(focusKey)}"]`);
  if (again) again.focus();
  else if (focusKey) root.querySelector("h2")?.setAttribute("tabindex", "-1"), root.querySelector("h2")?.focus();
}

root.addEventListener("click", (event) => {
  const target = event.target.closest("[data-msg]");
  if (!target) return;
  const message = target.dataset.msg;
  if (message.startsWith("view:")) {
    try { location.hash = message.slice(5); } catch (error) { /* the hash is only a convenience */ }
  }
  send(message, message);
});

root.addEventListener("change", (event) => {
  if (event.target.dataset.change) send(`${event.target.dataset.change}:${event.target.value}`);
});

function fromHash() {
  const view = location.hash.slice(1);
  if (allowedViews.has(view)) app.dispatch(["view", view]);
  render();
}
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
